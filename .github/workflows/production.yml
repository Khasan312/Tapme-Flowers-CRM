name: CI and releases

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ["release-*", "hotfix-release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'production-release' || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: tapme_ci
          POSTGRES_USER: tapme
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tapme -d tapme_ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      POSTGRES_DB: tapme_ci
      POSTGRES_USER: tapme
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TAPME_BOOTSTRAP_PASSWORD: CiOnly-Long-Test-Password-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: python3 infra/cd/release_policy.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deployment failure and rollback checks
        run: |
          bash -n infra/cd/deploy.sh
          shellcheck infra/cd/deploy.sh
          bash -n infra/github/apply-main-protection.sh
          bash -n infra/github/apply-branch-protection.sh
          bash -n .githooks/pre-push
          shellcheck infra/github/apply-main-protection.sh infra/github/apply-branch-protection.sh .githooks/pre-push
          python3 -m unittest discover -s infra/cd/tests -v
      - name: Validate deployment Compose files
        run: |
          export TAPME_DEPLOY_ROOT="$RUNNER_TEMP/tapme-compose"
          export PUBLIC_DOMAIN=tapme.example POSTGRES_DB=tapme_ci POSTGRES_USER=tapme POSTGRES_PASSWORD=ci-only
          export TAPME_IMAGE_PREFIX=ghcr.io/khasan312/tapme-flowers-crm IMAGE_TAG="$GITHUB_SHA" COLOR=blue
          mkdir -p "$TAPME_DEPLOY_ROOT"
          printf 'PUBLIC_DOMAIN=tapme.example\n' > "$TAPME_DEPLOY_ROOT/.env.production"
          docker compose -f infra/cd/core.yaml config --quiet
          docker compose -p tapme-blue -f infra/cd/release.yaml config --quiet
      - name: Check first deployment network provisioning
        env:
          PUBLIC_DOMAIN: tapme.example
          POSTGRES_DB: tapme_ci
          POSTGRES_USER: tapme
          POSTGRES_PASSWORD: ci-only
        run: |
          export TAPME_DEPLOY_ROOT="$RUNNER_TEMP/tapme-compose"
          docker compose -f infra/cd/core.yaml create --no-recreate gateway
          docker network inspect tapme-edge > /dev/null
          test -z "$(docker compose -f infra/cd/core.yaml ps --status running -q gateway)"
          docker run --rm --network tapme-edge caddy:2.10-alpine caddy version
      - name: Backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.11.8
          uv sync --frozen
      - name: Backend checks
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run pytest -q
      - name: Frontend checks and build
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run test:chat-keyboard
          npm run build

  images:
    name: Build ${{ matrix.component }} image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            context: backend
          - component: web
            context: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build image
        env:
          COMPONENT: ${{ matrix.component }}
          CONTEXT: ${{ matrix.context }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}:${GITHUB_SHA}"
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image" "$CONTEXT"
      - name: Validate Caddy configuration
        if: matrix.component == 'web'
        run: |
          docker run --rm -e PUBLIC_DOMAIN=tapme.example -e API_UPSTREAM=api:8000 \
            -v "$PWD/infra/cd/frontend.Caddyfile:/etc/caddy/Caddyfile:ro" \
            "ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" \
            caddy validate --config /etc/caddy/Caddyfile
          export TAPME_DEPLOY_ROOT="$RUNNER_TEMP/web-route-check"
          export PUBLIC_DOMAIN=tapme.example COLOR=blue IMAGE_TAG="$GITHUB_SHA"
          export TAPME_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p "$TAPME_DEPLOY_ROOT"
          printf 'PUBLIC_DOMAIN=tapme.example\n' > "$TAPME_DEPLOY_ROOT/.env.production"
          docker volume create tapme-assets
          docker run --rm -v tapme-assets:/assets --entrypoint /bin/sh \
            "${TAPME_IMAGE_PREFIX}-web:${IMAGE_TAG}" -c 'echo previous-release > /assets/retained.txt'
          docker compose -p tapme-web-route-check -f infra/cd/release.yaml --profile init \
            run --rm -T --no-deps assets
          docker run -d --name tapme-web-check -p 127.0.0.1:8088:80 \
            -e PUBLIC_DOMAIN=tapme.example -e API_UPSTREAM=api:8000 \
            -v "$PWD/infra/cd/frontend.Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v tapme-assets:/srv/shared-assets:ro \
            "${TAPME_IMAGE_PREFIX}-web:${IMAGE_TAG}" caddy run --config /etc/caddy/Caddyfile
          trap 'docker rm -f tapme-web-check' EXIT
          python3 infra/cd/check_web_routes.py http://127.0.0.1:8088
          test "$(curl --fail --silent http://127.0.0.1:8088/crm-flowers/assets/retained.txt)" = previous-release
          mkdir -p "$RUNNER_TEMP/gateway"
          cp infra/cd/gateway.Caddyfile "$RUNNER_TEMP/gateway/Caddyfile"
          printf 'reverse_proxy candidate:80\n' > "$RUNNER_TEMP/gateway/active.caddy"
          docker run --rm -e PUBLIC_DOMAIN=tapme.example \
            -v "$RUNNER_TEMP/gateway:/etc/caddy:ro" \
            "ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}" \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Publish private image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}:${GITHUB_SHA}"

  deploy:
    name: Deploy production
    needs: images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check explicit server opt-in
        shell: bash
        run: |
          if [[ ! -f /srv/tapme/.deploy-enabled ]]; then
            echo '::error::Deployment is disabled. Run as deploy: touch /srv/tapme/.deploy-enabled'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release against deployed revision
        run: python3 infra/cd/release_policy.py --state-file /srv/tapme/state/current
      - name: Deploy checked commit
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash infra/cd/deploy.sh "$GITHUB_SHA"
      - name: Record deployed release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          umask 077
          printf '%s %s\n' "$RELEASE_TAG" "$GITHUB_SHA" > /srv/tapme/state/release.next
          mv /srv/tapme/state/release.next /srv/tapme/state/release
          printf 'Deployed `%s` (`%s`).\n' "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
