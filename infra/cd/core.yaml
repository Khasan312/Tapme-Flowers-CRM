name: tapme-core
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    networks: [private]
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  gateway:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    ports: ["80:80", "443:443", "127.0.0.1:8080:8080"]
    volumes:
      - ${TAPME_DEPLOY_ROOT:?Set TAPME_DEPLOY_ROOT}/gateway:/etc/caddy:ro
      - certificates:/data
      - caddy_config:/config
    networks: [edge]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
networks:
  private:
    name: tapme-private
    internal: true
  edge:
    name: tapme-edge
volumes:
  database:
    name: tapme-database
  redis:
    name: tapme-redis
  certificates:
    name: tapme-certificates
  caddy_config:
    name: tapme-caddy-config
