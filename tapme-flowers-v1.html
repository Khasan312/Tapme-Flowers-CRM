<title>Tapme Flowers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F3; --surface:#FFFFFF; --surface-2:#EFF1EC; --surface-3:#E6E9E3;
  --border:#E1E5DE; --border-2:#8A918A;
  --ink:#171C19; --ink-2:#3B443F; --muted:#5C665F; --dim:#7A837C;
  --rail:#0F2A22; --rail-ink:#CFDBD4; --rail-dim:#8FA79C; --rail-active:#1F5C4B; --rail-line:#1B3B31;
  --accent:#6B3FA0; --accent-2:#56338A; --accent-bg:#F0EAF9; --on-accent:#FFFFFF;
  --ok:#2B7049; --ok-bg:#E3F1E7; --warn:#8A6510; --warn-bg:#F8EED8; --crit:#B23C2E; --crit-bg:#F9E6E2;
  --info:#2F5C8F; --info-bg:#E4ECF7; --neutral:#5C665F; --neutral-bg:#ECEFEA;
  --wa:#1F8A4C; --wa-bg:#E4F4EA;
  --fl-a:#F6D6DC; --fl-b:#E9C7E6; --fl-c:#F8E3B8; --fl-d:#D9E7C6; --fl-e:#CFE0F2; --fl-leaf:#5F8F5A;
  --device:#1E1C1F; --device-2:#3A373C;
  --shadow:0 1px 2px rgba(20,28,24,.06); --shadow-2:0 12px 32px rgba(20,28,24,.16);
  --r:12px; --r-sm:8px; --r-pill:999px;
  --sans:'Golos Text',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}
p{margin:0}a{color:inherit}
button{font:inherit;color:inherit}
:where(button,a,input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
[hidden]{display:none!important}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}
.ink{color:var(--ink)}.b{font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.spacer{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);border-right:1px solid var(--rail-line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;cursor:pointer}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8C5BC7,#5A2E8F);display:grid;place-items:center;color:#fff;flex:none}
.brand-name{font-weight:700;color:#fff;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--rail-dim);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:var(--rail-ink);text-align:left;cursor:pointer;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item[aria-current="page"]{background:var(--rail-active);color:#fff}
.nav-item svg{flex:none;opacity:.75}
.nav-item[aria-current="page"] svg{opacity:1}
.nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:var(--r-pill)}
.nav-item[aria-current="page"] .cnt{background:rgba(255,255,255,.2)}
.rail-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--rail-line);display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9px}.rail-foot:hover{background:rgba(255,255,255,.07)}
.rail-foot .shop-n{font-size:13px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot .shop-c{font-size:11px;color:var(--rail-dim)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.av.lg{width:44px;height:44px;font-size:16px}
.rail .av{background:#1F5C4B;color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 22px;min-height:58px}
.topbar h1{font-size:17px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:0 12px;height:36px;width:min(420px,100%);color:var(--muted)}
.search:focus-within{border-color:var(--border-2);background:#fff}
.search input{border:0;background:transparent;font:inherit;flex:1;min-width:0;outline:none;color:var(--ink)}
.usermenu{position:relative}
.ubtn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:10px;padding:4px 8px 4px 4px;cursor:pointer}
.ubtn:hover{background:var(--surface-2)}
.ubtn .un{font-size:13px;font-weight:500;color:var(--ink);line-height:1.1}
.ubtn .ur{font-size:11px;color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-2);min-width:250px;padding:6px;z-index:40}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:8px;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink)}
.menu button:hover,.menu a:hover{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--border);margin:6px 4px}
.menu .lab{font-size:11px;color:var(--dim);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.canvas{padding:20px 22px 40px;width:100%}
.screen{display:none}.screen.is-on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.page-hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-hd h1{font-size:22px}
.page-hd .sub{color:var(--muted);font-size:13px;margin-top:3px}

/* buttons, pills, tags */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2);border-color:var(--border-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.wa{background:var(--wa-bg);border-color:transparent;color:var(--wa)}
.btn.wa:hover{background:#D3ECDC}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.crit{background:var(--crit-bg);border-color:transparent;color:var(--crit)}.btn.crit:hover{background:#F3D6D0}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px}
.btn.block{width:100%;justify-content:center}
.btn svg{flex:none}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:#fff;color:var(--ink-2);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--border-2)}
.pill.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill .cnt{font-family:var(--mono);font-size:11px;opacity:.75}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.info{background:var(--info-bg);color:var(--info)}.tag.acc{background:var(--accent-bg);color:var(--accent)}.tag.wa{background:var(--wa-bg);color:var(--wa)}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-pill);background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.chip.fl{background:var(--fl-a)}.chip.fl2{background:var(--fl-b)}.chip.fl3{background:var(--fl-c)}.chip.fl4{background:var(--fl-d)}.chip.fl5{background:var(--fl-e)}

/* cards, lists, tables */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);min-height:48px;flex-wrap:wrap}
.card-hd h2{font-size:15px}
.card-bd{padding:16px}.card-bd.tight{padding:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--border-2)}
.kpi .kl{font-size:12px;color:var(--muted)}
.kpi .kv{font-size:26px;font-weight:600;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .kv .u{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .kf{font-size:12px;color:var(--dim);margin-top:4px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--border);cursor:pointer;min-height:58px}
.lrow:first-child{border-top:0}
.lrow:hover{background:#F8F9F6}
.lrow.is-sel{background:var(--accent-bg)}
.lrow .t{font-weight:500;color:var(--ink)}
.lrow .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .r{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#F8F9F6}
.tbl td.num,.tbl th.num{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px}
.dl dt{color:var(--muted)}.dl dd{margin:0;color:var(--ink)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.divider{height:1px;background:var(--border)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:8px;min-height:120px}
.kcol-hd{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.kcol-hd .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--border-2)}
.kcard .kt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.kcard .kn{font-family:var(--mono);color:var(--ink);font-weight:500}
.kcard .kb{margin-top:5px;font-weight:500;color:var(--ink);font-size:13px}
.kcard .ks{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .kf{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.kcard.late{border-left:3px solid var(--crit)}
.kcard.soon{border-left:3px solid var(--warn)}
.thumb{width:36px;height:36px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex:none;display:grid;place-items:center}
.thumb svg{width:100%;height:100%;display:block}
.thumb.lg{width:100%;height:150px;border-radius:10px}
.thumb.md{width:72px;height:72px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:center;padding:4px 0}
.cday{background:#fff;border:1px solid var(--border);border-radius:10px;min-height:86px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cday:hover{border-color:var(--border-2)}
.cday.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.cday.past{opacity:.55}
.cday .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cday.today .d{color:var(--accent);font-weight:600}
.cday .n{font-size:20px;font-weight:600;color:var(--ink);font-family:var(--mono);line-height:1.1}
.cday .n small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.cday .bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:auto}
.cday .bar i{display:block;height:100%;background:var(--accent)}
.cday .bar i.hi{background:var(--crit)}
.cday .hol{font-size:11px;color:var(--crit);font-weight:500}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;margin-left:5px;color:var(--dim)}
.pane{display:none}.pane.is-on{display:block}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font:inherit;color:var(--ink);background:#fff;width:100%;min-width:0}
.field textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
.field .hint{font-size:12px;color:var(--dim)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:0 12px;height:34px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--border)}
.seg button.is-on{background:var(--ink);color:#fff}
.found{background:var(--accent-bg);border:1px solid #DCCFF0;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.found .fn{font-weight:600;color:var(--ink)}
.found .fs{font-size:12px;color:var(--ink-2);margin-top:2px}
.items{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.items .it{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px 28px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--border);font-size:13px}
.items .it:first-child{border-top:0}
.items .it input{height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font:inherit;width:100%;min-width:0}
.items .tot{display:flex;justify-content:space-between;padding:10px;background:var(--surface-2);font-weight:600;color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--border-2);background:#fff;border-radius:var(--r-pill);height:28px;padding:0 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.quick button:hover{border-style:solid;background:var(--surface-2)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.toggle i{width:34px;height:20px;border-radius:10px;background:var(--surface-3);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle.on i{background:var(--ok)}.toggle.on i::after{left:16px}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(15,25,20,.35);z-index:50;display:none}
.scrim.is-on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-2)}
.drawer.is-open{transform:none}
.drawer-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.drawer-bd{padding:18px;overflow:auto;flex:1}
.drawer-ft{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;background:#fff}
.sec{margin-bottom:18px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600;margin-bottom:8px}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal.is-on{display:flex}
.mbox{background:#fff;border-radius:14px;width:min(760px,100%);box-shadow:var(--shadow-2);display:flex;flex-direction:column;max-height:92vh}
.mbox.sm{width:min(560px,100%)}
.m-hd{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
.m-bd{padding:20px;overflow:auto}
.m-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--ink);font-family:var(--mono);font-size:11px}
.steps .on b{background:var(--accent);color:#fff}
.steps .done b{background:var(--ok);color:#fff}
.drop{border:1.5px dashed var(--border-2);border-radius:12px;padding:26px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop b{color:var(--ink)}
.map{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px 10px;align-items:center;font-size:13px}
.map .src{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:6px 8px;border-radius:6px;color:var(--ink)}
.map select{height:32px;border:1px solid var(--border);border-radius:6px;font:inherit;padding:0 8px;background:#fff}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-i{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:0 0 14px;position:relative}
.tl-i::before{content:"";position:absolute;left:8px;top:16px;bottom:-2px;width:2px;background:var(--border)}
.tl-i:last-child::before{display:none}
.tl-i .dot{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--border-2);display:grid;place-items:center;margin-top:1px}
.tl-i.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-i.cur .dot{border-color:var(--accent);background:var(--accent-bg)}
.tl-i.cur .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tl-i .tt{font-weight:500;color:var(--ink);font-size:13px}
.tl-i .ts{font-size:12px;color:var(--muted)}
.tl-i.todo .tt{color:var(--dim);font-weight:400}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:all .18s;box-shadow:var(--shadow-2);max-width:calc(100% - 32px)}
.toast.is-on{opacity:1;transform:translateX(-50%)}

function tkTiming(o){var now=TODAY.getHours()*60+TODAY.getMinutes();if(o.status==='done'){var l=o.log.filter(function(x){return /(вруч|выдан)/i.test(x[1]);}).pop();return {tone:'mute',text:(o.type==='pickup'?'выдан':'вручён')+(l?' в '+l[0].split(' ')[1]:'')};}if(o.status==='cancel')return {tone:'mute',text:'отменён'};var p=winParts(o.win);if(!p)return {tone:'mute',text:''};if(o.date!==todayISO())return {tone:'mute',text:relDay(o.date)+', '+o.win};var a=o.win.split('–')[0],b=o.win.split('–').pop();if(p.e<now)return {tone:'crit',text:'опоздание '+dur(now-p.e)};if(p.s<=now&&now<=p.e)return {tone:'ok',text:o.type==='pickup'?'выдача сейчас':'окно идёт, до '+b+' '+dur(p.e-now)};if(p.s-now<=90&&(o.status==='new'||o.status==='work'))return {tone:'warn',text:'до '+a+' '+dur(p.s-now)};return {tone:'mute',text:'до '+a+' '+dur(p.s-now)};}

 if((t=e.target.closest('[data-m]'))){var o4=order(t.dataset.oid);var a=t.dataset.m;var by=PH.kind==='courier'?PH.uid:'u3';if(a==='take')setStatus(o4,'work','u3');else if(a==='ready')setStatus(o4,'ready','u3');else if(a==='route')setStatus(o4,'route',by);else if(a==='done')setStatus(o4,'done',by);else if(a==='nocall'){o4.flag='nocall';o4.log.push([nowStr(),'Не дозвонился, ждёт',by]);}toast({take:'Взяли в работу',ready:'Фото сохранено, заказ собран',route:'Отмечено',done:'Вручено, фото сохранено',nocall:'Менеджер получил сигнал'}[a]);renderPhone();return;}

document.addEventListener('change',function(e){var tf=e.target.closest('[data-tflorist]');if(tf&&tf.value){var fo=order(tf.dataset.tflorist);fo.florist=tf.value;setStatus(fo,'work','u1');toast('Передан флористу: '+firstName(staff(tf.value).name));refresh();return;}var t=e.target.closest('[data-assign]');if(t){var o=order(t.dataset.assign);o.courier=t.value||null;if(o.courier)o.log.push([nowStr(),'Назначен курьер: '+firstName(staff(o.courier).name),'u1']);toast(o.courier?'Курьер назначен':'Курьер снят');refresh();}});
document.addEventListener('input',function(e){var el=e.target;if(el.id==='no-phone'){var d=digits(el.value);var c=null;if(d.length>=5){c=CLIENTS.filter(function(x){var xd=digits(x.phone);return xd.indexOf(d)>=0||xd.slice(-d.length)===d;})[0]||null;}if(c)applyFound(c);else{NO.client=null;$('no-found').innerHTML='';}}else if(el.id==='no-rec'&&NO.client){var rr1=NO.client.rec.filter(function(r){return r.n===el.value;})[0];if(rr1){$('no-recphone').value=rr1.phone||'';if(rr1.addr)$('no-addr').value=rr1.addr;}$('no-recnote').textContent=rr1&&rr1.note?'О получателе: '+rr1.note:'';}else if(el.id==='twsearch'){VIEW.wallQuery=el.value;renderOrdersBody();}else if(el.id==='csearch'){VIEW.clientQuery=el.value;renderClients();}else if(el.id==='gsearch'){var v=el.value.trim();if(/^\d{4}$/.test(v)&&order(v)){openOrder(v);return;}var vc=v.toUpperCase().replace(/^TF-?/,'');var bo=ORDERS.filter(function(x){return x.code.slice(3)===vc;})[0];if(bo){openOrder(bo.id);return;}var bc=CLIENTS.filter(function(x){return String(x.code)===v;})[0];if(bc){renderClient(bc.id);show('client');return;}if(/^2\d{5}$/.test(v)){var br=CLIENTS.filter(function(x){return recById(x,v);})[0];if(br){renderClient(br.id);show('client');return;}}if(v.length>=2){VIEW.clientQuery=v;VIEW.clientFilter='all';if(VIEW.screen!=='clients')show('clients');else renderClients();}}else if(el.matches('[data-price]')){NO.items[+el.dataset.price][1]=+el.value||0;var tot=NO.items.reduce(function(a,x){return a+x[1];},0)+(NO.type==='courier'?300:0);$('no-items').querySelector('.tot .mono').textContent=money(tot)+' сом';}});
document.addEventListener('keydown',function(e){var tag=(e.target.tagName||'').toLowerCase();var typing=tag==='input'||tag==='textarea'||tag==='select';if(e.key==='Escape'){closeModal();closeDrawer();$('umenu').hidden=true;if(typing)e.target.blur();return;}if(e.key==='Enter'&&e.target.id==='task-new'){var v=e.target.value.trim();if(v){TASKS_EXTRA.push({id:'m'+(TASKS_EXTRA.length+1),txt:v});refresh();toast('Задача добавлена');}return;}if(typing||$('app').hidden)return;if(e.key==='n'||e.key==='N'||e.key==='т'||e.key==='Т'){e.preventDefault();newOrderModal();}else if(e.key==='/'||e.key==='.'){e.preventDefault();$('gsearch').focus();}});
window.addEventListener('hashchange',function(){var n=(location.hash||'').replace('#','');if(TITLES[n]&&n!==VIEW.screen)show(n);});
/* подсказки */
var tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl);var tipTimer=null,tipFor=null;
function showTip(el){var txt=el.getAttribute('data-tip');if(!txt)return;var key=el.getAttribute('data-key');tipFor=el;tipEl.innerHTML=h(txt)+(key?'<span class="k">'+h(key)+'</span>':'');tipEl.classList.add('is-on');var r=el.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight,x,y;if(el.closest('.rail')&&window.innerWidth>900){x=r.right+10;y=r.top+r.height/2-th/2;}else{x=r.left+r.width/2-tw/2;y=r.bottom+8;if(y+th>window.innerHeight-8)y=r.top-th-8;}x=Math.max(8,Math.min(x,window.innerWidth-tw-8));y=Math.max(8,y);tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
function hideTip(){clearTimeout(tipTimer);tipTimer=null;tipFor=null;tipEl.classList.remove('is-on');}
document.addEventListener('mouseover',function(e){var el=e.target.closest('[data-tip]');if(!el||el===tipFor)return;clearTimeout(tipTimer);tipTimer=setTimeout(function(){showTip(el);},320);});
document.addEventListener('mouseout',function(e){var el=e.target.closest('[data-tip]');if(el&&!(e.relatedTarget&&el.contains(e.relatedTarget)))hideTip();});
document.addEventListener('focusin',function(e){var el=e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('focusout',hideTip);document.addEventListener('scroll',hideTip,true);document.addEventListener('mousedown',hideTip,true);document.addEventListener('keydown',function(){if(tipFor)hideTip();},true);
navCounts();var start=(location.hash||'').replace('#','');show(TITLES[start]?start:'orders');
})();
